apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.hello.name }}
spec:
  replicas: {{ .Values.hello.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.hello.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.hello.name }}
    spec:
      containers:
      - name: nginx
        image: {{ .Values.hello.image.repository }}:{{ .Values.hello.image.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
